name: flutter_multisport_adapters
description: "Compatibility bundle for the optional GPS and BLE sport adapters. New apps can install either adapter separately."
version: 0.0.1-beta
repository: https://github.com/congtuandevmobile/flutter_sport_sdk
resolution: workspace

environment:
  sdk: ^3.10.7
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_tracking_gps_adapter: ^0.0.1-beta
  flutter_sport_ble_adapter: ^0.0.1-beta

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_activity: ^0.0.1-beta
  flutter_sport_ble: ^0.0.1-beta
  flutter_tracking_gps: ^0.0.1-beta.3

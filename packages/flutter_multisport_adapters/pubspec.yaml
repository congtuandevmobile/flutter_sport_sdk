name: flutter_multisport_adapters
description: "Adapters that feed flutter_activity and flutter_multisport from flutter_tracking_gps and flutter_sport_ble: a GPS total or the counter of one Bluetooth device as a progress source, and heart rate, cadence, speed or power as telemetry, each with the time it was really measured."
version: 0.0.1-beta
repository: https://github.com/congtuandevmobile/flutter_sport_sdk
resolution: workspace

environment:
  sdk: ^3.10.7
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_activity: ^0.0.1-beta
  flutter_sport_ble: ^0.0.1-beta
  flutter_tracking_gps: ^0.0.1-beta.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

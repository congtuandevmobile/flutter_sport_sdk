name: ios-native
on:
  push:
    paths: ['shared/sensor-core/**', 'packages/**/ios/**', 'packages/flutter_tracking_gps/tracking-core/**', '.github/workflows/ios-native.yml']
  pull_request:
    paths: ['shared/sensor-core/**', 'packages/**/ios/**', 'packages/flutter_tracking_gps/tracking-core/**', '.github/workflows/ios-native.yml']
jobs:
  xctest:
    # The XCFrameworks are not committed: they are built here before the iOS tests.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - name: Build SensorCore.xcframework
        run: packages/flutter_sport_ble/tool/build_core.sh debug
      - name: flutter_sport_ble (XCTest)
        working-directory: packages/flutter_sport_ble/example/ios
        run: |
          pod install
          xcodebuild test -workspace Runner.xcworkspace -scheme Runner \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' -only-testing:RunnerTests
      - name: Build WorkoutCore.xcframework
        run: packages/flutter_workout/tool/build_core.sh debug
      - name: flutter_workout (XCTest)
        working-directory: packages/flutter_workout/example/ios
        run: |
          pod install
          xcodebuild test -workspace Runner.xcworkspace -scheme Runner \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' -only-testing:RunnerTests

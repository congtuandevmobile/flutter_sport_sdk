name: sensor-core
on:
  push:
    paths: ['shared/**', '.github/workflows/sensor-core.yml']
  pull_request:
    paths: ['shared/**', '.github/workflows/sensor-core.yml']
jobs:
  jvm-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Core tests (Kotlin)
        working-directory: shared/sensor-core
        run: ./gradlew --no-daemon jvmTest
      - name: Workout core tests (Kotlin)
        working-directory: shared/workout-core
        run: ./gradlew --no-daemon jvmTest

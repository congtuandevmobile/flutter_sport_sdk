name: kotlin-cores
on:
  push:
    paths: ['packages/**/*-core/**', '.github/workflows/sensor-core.yml']
  pull_request:
    paths: ['packages/**/*-core/**', '.github/workflows/sensor-core.yml']
jobs:
  jvm-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Core tests (Kotlin)
        working-directory: packages/flutter_sport_ble/sensor-core
        run: ./gradlew --no-daemon jvmTest
      - name: Workout core tests (Kotlin)
        working-directory: packages/flutter_workout/workout-core
        run: ./gradlew --no-daemon jvmTest
      - name: Challenge core tests (Kotlin)
        working-directory: packages/flutter_challenge/challenge-core
        run: ./gradlew --no-daemon jvmTest

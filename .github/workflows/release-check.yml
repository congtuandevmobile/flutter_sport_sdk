name: release-check
# Each SDK must build from its own package, alone, in a fresh Flutter app.
on:
  workflow_dispatch:
  pull_request:
    paths: ['packages/**', 'tool/release_check.sh', '.github/workflows/release-check.yml']
jobs:
  alone:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        package: [flutter_tracking_gps, flutter_sport_ble, flutter_workout, flutter_challenge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: tool/release_check.sh ${{ matrix.package }} both

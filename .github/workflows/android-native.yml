name: android-native
on:
  push:
    paths: ['packages/**/*-core/**', 'packages/**/android/**', '.github/workflows/android-native.yml']
  pull_request:
    paths: ['packages/**/*-core/**', 'packages/**/android/**', '.github/workflows/android-native.yml']
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      # gradlew and the wrapper jar are git-ignored in a Flutter example: `flutter build apk --config-only` creates them.
      - name: flutter_sport_ble (Android unit tests)
        run: |
          (cd packages/flutter_sport_ble/example && flutter build apk --config-only)
          cd packages/flutter_sport_ble/example/android && ./gradlew --no-daemon :flutter_sport_ble:testDebugUnitTest
      - name: flutter_workout (Android unit tests)
        run: |
          (cd packages/flutter_workout/example && flutter build apk --config-only)
          cd packages/flutter_workout/example/android && ./gradlew --no-daemon :flutter_workout:testDebugUnitTest
      - name: flutter_challenge (Android unit tests)
        run: |
          (cd packages/flutter_challenge/example && flutter build apk --config-only)
          cd packages/flutter_challenge/example/android && ./gradlew --no-daemon :flutter_challenge:testDebugUnitTest
      - name: flutter_tracking_gps (Android unit tests)
        run: |
          (cd packages/flutter_tracking_gps/example && flutter build apk --config-only)
          cd packages/flutter_tracking_gps/example/android && ./gradlew --no-daemon :flutter_tracking_gps:testDebugUnitTest

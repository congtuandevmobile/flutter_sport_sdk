name: Create package tags

on:
  push:
    branches: ['**']

concurrency:
  group: package-release-dispatch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  dispatch:
    if: >-
      contains(github.event.head_commit.message, '[release') ||
      contains(github.event.head_commit.message, '[tag')
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || github.token }}
      - name: Read release marker
        id: plan
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: tool/release_plan.sh >> "$GITHUB_OUTPUT"
      - name: Enforce release branch
        if: steps.plan.outputs.mode == 'release' && github.ref_name != 'main'
        run: |
          echo "pub.dev releases are allowed only from main; current branch: ${{ github.ref_name }}" >&2
          exit 1
      - uses: actions/setup-java@v4
        if: steps.plan.outputs.mode != 'none'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        if: steps.plan.outputs.mode != 'none'
        with:
          channel: stable
      - name: Analyze, test, and build selected packages
        if: steps.plan.outputs.mode != 'none'
        run: >-
          tool/validate_release.sh
          "${{ steps.plan.outputs.mode }}"
          "${{ steps.plan.outputs.packages }}"
      - name: Build artifacts and create tags
        if: steps.plan.outputs.mode != 'none'
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          RELEASE_ARTIFACTS_READY: '1'
        run: >-
          tool/dispatch_release.sh
          "${{ steps.plan.outputs.mode }}"
          "${{ steps.plan.outputs.packages }}"
          "${{ github.sha }}"
